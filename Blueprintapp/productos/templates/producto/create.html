{% extends 'base.html' %}
{% block content %}

<h1>Registrar producto</h1>

<form method="POST">
    <label>Nombre:</label>
    <input type="text" name="nombre" required>

    <br><br>

    <label>Precio:</label>
    <input type="number" name="precio" step="0.01" min="0" required>

    <br><br>

    <label>Stock:</label>
    <input type="number" name="stock" min="0" required>

    <br><br>

    <button type="submit">Guardar</button>
</form>

{% endblock %}
